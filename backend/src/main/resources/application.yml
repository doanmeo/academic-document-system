server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: academic-docs
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    # Supabase PostgreSQL Database (Direct connection: port 5432, Transaction Pooler: port 6543)
    url: jdbc:postgresql://${DB_HOST:db.qsxuyysnqmyristjiwws.supabase.co}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=require
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:change_me}
    driver-class-name: org.postgresql.Driver
    # Cấu hình MySQL cũ (tham khảo nếu cần chạy MySQL local)
    # url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:academic_docs}?useUnicode=true&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false
    # username: ${DB_USER:root}
    # password: ${DB_PASSWORD:change_me}
    # driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:none}
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

app:
  jwt:
    secret: ${JWT_SECRET:change_me_to_long_random_string_at_least_32_chars}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  supabase:
    url: ${SUPABASE_URL:https://qsxuyysnqmyristjiwws.supabase.co}
    key: ${SUPABASE_SERVICE_ROLE_KEY:eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFzeHV5eXNucW15cmlzdGppd3dzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxNjgyMzEsImV4cCI6MjEwNTc0NDIzMX0.7vQ4PwJNZYQsVBvkH0FabeeZV_5VkgeJ5YerpDasPHs}
    bucket: ${SUPABASE_BUCKET:documents}
    url-expiry: ${SIGNED_URL_EXPIRY_SECONDS:3600}
  upload:
    max-size: ${MAX_FILE_SIZE_MB:20}
    allowed-mime: ${ALLOWED_MIME_TYPES:application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.openxmlformats-officedocument.presentationml.presentation,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/zip}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.8-flash}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
