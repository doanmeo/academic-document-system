server:
  port: ${SERVER_PORT:8080}
  tomcat:
    max-swallow-size: 52428800

spring:
  application:
    name: academic-docs
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      enabled: true
      max-file-size: ${MAX_FILE_SIZE:50MB}
      max-request-size: ${MAX_REQUEST_SIZE:50MB}
  datasource:
    # Supabase PostgreSQL Database (Direct connection: port 5432, Transaction Pooler: port 6543)
    url: jdbc:postgresql://${DB_HOST:db.qsxuyysnqmyristjiwws.supabase.co}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=require
    username: ${DB_USER:academic_user}
    password: ${DB_PASSWORD:AcademicDocsUtc2026!}
    driver-class-name: org.postgresql.Driver
    # Cấu hình MySQL cũ (tham khảo nếu cần chạy MySQL local)
    # url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:academic_docs}?useUnicode=true&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false
    # username: ${DB_USER:root}
    # password: ${DB_PASSWORD:change_me}
    # driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:none}
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

app:
  jwt:
    secret: ${JWT_SECRET:change_me_to_long_random_string_at_least_32_chars}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  supabase:
    url: ${SUPABASE_URL:https://qsxuyysnqmyristjiwws.supabase.co}
    key: ${SUPABASE_SERVICE_ROLE_KEY:your_supabase_service_role_key}
    bucket: ${SUPABASE_BUCKET:documents}
    url-expiry: ${SIGNED_URL_EXPIRY_SECONDS:3600}
  upload:
    max-size: ${MAX_FILE_SIZE_MB:50}
    allowed-mime: ${ALLOWED_MIME_TYPES:application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/msword,application/vnd.openxmlformats-officedocument.presentationml.presentation,application/vnd.ms-powerpoint,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/zip,application/octet-stream}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.8-flash}
  openrouter:
    api-key: ${OPENROUTER_API_KEY:}
    base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
    model: ${OPENROUTER_MODEL:nvidia/nemotron-3-ultra-550b-a55b:free}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
