server:
  port: ${PORT:8080}
  tomcat:
    threads:
      max: 50
      min-spare: 5
    max-swallow-size: 52428800

spring:
  datasource:
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
      leak-detection-threshold: 30000
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:none}
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

# Swagger có thể bật hoặc tắt linh hoạt ở môi trường demo qua biến môi trường ENABLE_SWAGGER
springdoc:
  api-docs:
    enabled: ${ENABLE_SWAGGER:true}
  swagger-ui:
    enabled: ${ENABLE_SWAGGER:true}
